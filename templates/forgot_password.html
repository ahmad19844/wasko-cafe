{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-wasko">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center">Forgot Password</h4>
        <p class="text-muted small">Enter your registered email address. We'll send a temporary password you can use to log in, then change immediately.</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Registered Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary w-100">Send Temporary Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
