{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-wasko">
      <div class="card-body p-4">
        <h4 class="mb-3 text-center">Change Password</h4>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">New Password <small class="text-muted">(12 chars, letters + numbers)</small></label>
            <input type="text" name="new_password" class="form-control" minlength="12" maxlength="12" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm New Password</label>
            <input type="text" name="confirm_password" class="form-control" minlength="12" maxlength="12" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
