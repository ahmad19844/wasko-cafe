{% extends "base.html" %}
{% block title %}Result — {{ quiz.title }}{% endblock %}
{% block content %}
<div class="card card-wasko">
  <div class="card-body text-center py-5">
    <h4>{{ quiz.title }}</h4>
    <p class="display-5 fw-bold my-3">{{ attempt.score }} / {{ attempt.total }}</p>
    <a href="{{ url_for('course_detail', course_id=quiz.course_id) }}" class="btn btn-primary">Back to Course</a>
  </div>
</div>
{% endblock %}
