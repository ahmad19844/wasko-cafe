services:
  - type: web
    name: wasko-virtual-academy
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Admin@1984
      - key: DATABASE_URL
        fromDatabase:
          name: wasko-db
          property: connectionString
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM
        value: "no-reply@waskoacademy.com"

databases:
  - name: wasko-db
    plan: free
